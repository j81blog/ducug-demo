{{ if (hugo.Data).sponsors.sponsor }}
<section class="sponsor-wall my-10">
  <h2 class="text-xl font-semibold mb-6 text-center">Onze sponsors</h2>
  <div class="flex flex-wrap gap-6 items-center justify-center">
    {{ range (hugo.Data).sponsors.sponsor }}
    <a href="{{ .url }}" target="_blank" rel="noopener sponsored"
       class="flex items-center justify-center p-4 rounded-xl border border-neutral-200 dark:border-neutral-700 hover:border-primary-400 transition-colors min-w-[120px]"
       title="{{ .name }}">
      {{ if .logo }}
      <img src="{{ .logo }}" alt="{{ .name }}" class="h-10 max-w-[140px] object-contain" loading="lazy">
      {{ else }}
      <span class="text-sm font-medium text-neutral-700 dark:text-neutral-300">{{ .name }}</span>
      {{ end }}
    </a>
    {{ end }}
  </div>
</section>
{{ end }}
